<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>英検リスニング シャドーイング</title>
<style>
  :root{
    --bg:#f6f7fb;
    --card:#ffffff;
    --text:#1f2937;
    --muted:#6b7280;
    --line:#e5e7eb;
    --accent:#3157d5;
    --accent-hover:#2546b8;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic",Meiryo,sans-serif;
    background:var(--bg);
    color:var(--text);
  }
  .wrap{
    max-width:900px;
    margin:0 auto;
    padding:40px 18px 70px;
  }
  header{
    margin-bottom:28px;
  }
  h1{
    margin:0 0 10px;
    font-size:clamp(1.7rem,4vw,2.5rem);
  }
  .sub{
    color:var(--muted);
    margin:0;
    line-height:1.7;
  }
  .section-title{
    margin:34px 0 14px;
    font-size:1.25rem;
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
    gap:14px;
  }
  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:16px;
    padding:18px;
    box-shadow:0 8px 24px rgba(31,41,55,.06);
  }
  .label{
    display:inline-block;
    font-size:.78rem;
    font-weight:700;
    color:var(--accent);
    background:#eef2ff;
    border-radius:999px;
    padding:4px 9px;
    margin-bottom:12px;
  }
  .card h2{
    font-size:1.08rem;
    margin:0 0 8px;
    line-height:1.5;
  }
  .card p{
    margin:0 0 16px;
    color:var(--muted);
    font-size:.92rem;
    line-height:1.6;
  }
  .btn{
    display:block;
    width:100%;
    text-align:center;
    text-decoration:none;
    color:white;
    background:var(--accent);
    border-radius:12px;
    padding:12px 14px;
    font-weight:800;
    transition:.15s;
  }
  .btn:hover{
    background:var(--accent-hover);
    transform:translateY(-1px);
  }
  footer{
    margin-top:40px;
    color:var(--muted);
    font-size:.84rem;
    text-align:center;
  }
</style>
</head>
<body>
  <main class="wrap">
    <header>
      <h1>英検リスニング シャドーイング</h1>
      <p class="sub">
        センテンスごとに音声を確認し、最後はスクリプトを見ずに通してシャドーイングする練習ページです。<br>
        教材は少しずつ追加していきます。
      </p>
    </header>

    <h2 class="section-title">英検準2級</h2>

    <div class="grid">
      <section class="card">
        <span class="label">Listening Part 1</span>
        <h2>英検準２級2025年度 第２回 Part1</h2>
        <p>1文ずつ音声確認 → 英文・和訳を隠す → 本番シャドーイング</p>
        <a class="btn" href="Eiken_Pre2_Listening_Part1_Shadowing_No1-10.html">
          英検準２級2025年度 第２回 Part1
        </a>
      </section>

      <!--
      ★ 今後追加するときは、この card をコピーして使えます。

      <section class="card">
        <span class="label">Listening Part 2</span>
        <h2>英検準２級2025年度 第２回 Part2</h2>
        <p>説明文をここに入れます。</p>
        <a class="btn" href="YOUR_FILE_NAME.html">
          英検準２級2025年度 第２回 Part2
        </a>
      </section>
      -->
    </div>

    <footer>
      English Listening Shadowing Practice
    </footer>
  </main>
</body>
</html>
